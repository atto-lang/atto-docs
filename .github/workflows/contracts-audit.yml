name: Contracts safety audit

on:
  pull_request:
    paths:
      - "agreements/**"
      - "tests/**"
      - ".github/workflows/contracts-audit.yml"
      - "README.md"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned GitHub tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run offline contract audit and mutation tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
